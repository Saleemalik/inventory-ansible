---
# tasks file for roles/gunicorn

- name: Install Gunicorn
  become: true
  ansible.builtin.pip:
    name: gunicorn
    virtualenv: "{{ venv_directory }}"

- name: Ensure application directory is writable by application group
  become: true
  ansible.builtin.file:
    path: "{{ app_directory }}"
    owner: "{{ deploy_user }}"
    group: "{{ app_group }}"
    mode: "0775"

- name: Install Gunicorn systemd service
  become: true
  ansible.builtin.template:
    src: gunicorn.service.j2
    dest: "/etc/systemd/system/{{ gunicorn_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Gunicorn

- name: Enable and start Gunicorn
  become: true
  ansible.builtin.systemd:
    name: "{{ gunicorn_service_name }}"
    enabled: true
    state: started
    daemon_reload: true