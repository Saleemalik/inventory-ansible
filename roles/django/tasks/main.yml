---
# tasks file for roles/django

- name: Configure Django environment file
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: "{{ django_env_file }}"
    owner: "{{ deploy_user }}"
    group: "{{ app_group }}"
    mode: "0640"

- name: Ensure Django logs directory exists
  become: true
  ansible.builtin.file:
    path: "{{ app_directory }}/logs"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Ensure Django static files directory exists
  become: true
  ansible.builtin.file:
    path: "{{ static_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Ensure Django media directory exists
  become: true
  ansible.builtin.file:
    path: "{{ media_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Run Django system checks
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: "{{ django_python }} {{ django_manage_py }} check"
    chdir: "{{ app_directory }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
  changed_when: false

- name: Run Django database migrations
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: "{{ django_python }} {{ django_manage_py }} migrate --noinput"
    chdir: "{{ app_directory }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"

- name: Check whether Django superuser exists
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    argv:
      - "{{ django_python }}"
      - "{{ django_manage_py }}"
      - shell
      - -c
      - "from django.contrib.auth import get_user_model; print(get_user_model().objects.filter(username='{{ django_superuser_username }}').exists())"
  register: django_superuser_exists
  changed_when: false

- name: Determine whether Django superuser exists
  ansible.builtin.set_fact:
    django_superuser_found: "{{ django_superuser_exists.stdout_lines | last | trim | bool }}"

- name: Create Django superuser
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: >
      {{ django_python }} {{ django_manage_py }}
      createsuperuser
      --username={{ django_superuser_username }}
      --email={{ django_superuser_email }}
      --noinput
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"
    DJANGO_SUPERUSER_PASSWORD: "{{ django_superuser_password }}"
  when: not django_superuser_found
  no_log: true

- name: Collect Django static files
  become: true
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    cmd: "{{ django_python }} {{ django_manage_py }} collectstatic --noinput"
    chdir: "{{ app_directory }}"
  environment:
    DJANGO_SETTINGS_MODULE: "{{ django_settings_module }}"