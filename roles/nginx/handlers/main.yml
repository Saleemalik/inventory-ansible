---
# handlers file for roles/nginx

- name: Test Nginx configuration
  become: true
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Reload Nginx
  become: true
  ansible.builtin.systemd:
    name: "{{ nginx_service_name }}"
    state: reloaded